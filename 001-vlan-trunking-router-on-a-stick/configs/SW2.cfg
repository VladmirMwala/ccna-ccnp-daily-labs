! =====================================================================
!  Day 001 | SW2 - Access switch + trunk to SW1
!  Platform : Cisco 2960-24TT (Packet Tracer 8.x)
!  Ports    : G0/2 -> SW1 G0/2 (trunk)
!             Fa0/1 -> PC3 (VLAN 10)      Fa0/2 -> PC4 (VLAN 20)
!  Usage    : Paste from user EXEC mode (Switch>).
!  NOTE     : Replace every <REDACTED> with your own lab password first.
! =====================================================================
enable
configure terminal
!
! ---------------------------------------------------------------------
! 1. Identity and secure local access
! ---------------------------------------------------------------------
hostname SW2
no ip domain-lookup
ip domain-name lab.local
enable secret <REDACTED>
username admin privilege 15 secret <REDACTED>
service password-encryption
banner motd # Authorized access only. All activity is monitored. #
!
! ---------------------------------------------------------------------
! 2. VTP transparent + VLANs (must match SW1: same IDs on both ends)
! ---------------------------------------------------------------------
vtp mode transparent
!
vlan 10
 name SALES
vlan 20
 name IT
vlan 99
 name MGMT
vlan 998
 name PARKING
vlan 999
 name NATIVE
!
! ---------------------------------------------------------------------
! 3. Trunk to SW1 - must match SW1 G0/2 exactly (mode, native, allowed)
! ---------------------------------------------------------------------
interface GigabitEthernet0/2
 description TRUNK to SW1 G0/2
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99,999
 no shutdown
!
! ---------------------------------------------------------------------
! 4. Access ports for end hosts
! ---------------------------------------------------------------------
interface FastEthernet0/1
 description PC3 - SALES
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface FastEthernet0/2
 description PC4 - IT
 switchport mode access
 switchport access vlan 20
 no shutdown
!
! ---------------------------------------------------------------------
! 5. Unused ports (including G0/1 on this switch): parked and shut
! ---------------------------------------------------------------------
interface range FastEthernet0/3 - 24, GigabitEthernet0/1
 description UNUSED - parked
 switchport mode access
 switchport access vlan 998
 shutdown
!
! ---------------------------------------------------------------------
! 6. Management SVI in VLAN 99, VLAN 1 disabled
! ---------------------------------------------------------------------
interface Vlan1
 no ip address
 shutdown
!
interface Vlan99
 description MGMT SVI
 ip address 192.168.99.12 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
! ---------------------------------------------------------------------
! 7. SSH v2 and lines
! ---------------------------------------------------------------------
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
!
line console 0
 exec-timeout 5 0
 logging synchronous
 login local
!
line vty 0 15
 exec-timeout 5 0
 logging synchronous
 login local
 transport input ssh
!
end
write memory
