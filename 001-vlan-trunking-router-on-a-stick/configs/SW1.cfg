! =====================================================================
!  Day 001 | SW1 - Access switch + trunks to R1 and SW2
!  Platform : Cisco 2960-24TT (Packet Tracer 8.x)
!  Ports    : G0/1 -> R1 G0/0/0 (trunk)   G0/2 -> SW2 G0/2 (trunk)
!             Fa0/1 -> PC1 (VLAN 10)      Fa0/2 -> PC2 (VLAN 20)
!  Usage    : Paste from user EXEC mode (Switch>).
!  NOTE     : Replace every <REDACTED> with your own lab password first.
! =====================================================================
enable
configure terminal
!
! ---------------------------------------------------------------------
! 1. Identity and secure local access
! ---------------------------------------------------------------------
hostname SW1
no ip domain-lookup
ip domain-name lab.local
enable secret <REDACTED>
username admin privilege 15 secret <REDACTED>
service password-encryption
banner motd # Authorized access only. All activity is monitored. #
!
! ---------------------------------------------------------------------
! 2. VTP transparent: this switch will not accept or advertise VLAN
!    database changes, and VLANs are saved in the running-config.
! ---------------------------------------------------------------------
vtp mode transparent
!
! ---------------------------------------------------------------------
! 3. VLANs
!    998 = parking VLAN for unused ports (separate from native, so a
!          rogue device on a spare port never lands in the native VLAN)
!    999 = native VLAN for trunks (moved off VLAN 1, carries no users)
! ---------------------------------------------------------------------
vlan 10
 name SALES
vlan 20
 name IT
vlan 99
 name MGMT
vlan 998
 name PARKING
vlan 999
 name NATIVE
!
! ---------------------------------------------------------------------
! 4. Trunks - static 802.1Q, DTP disabled, native 999, pruned list.
!    (2960 supports dot1q only, so "switchport trunk encapsulation" is
!     not needed. On a 3560/3650 you must set it before "mode trunk".)
! ---------------------------------------------------------------------
interface GigabitEthernet0/1
 description TRUNK to R1 G0/0/0
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99,999
 no shutdown
!
interface GigabitEthernet0/2
 description TRUNK to SW2 G0/2
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99,999
 no shutdown
!
! ---------------------------------------------------------------------
! 5. Access ports for end hosts
! ---------------------------------------------------------------------
interface FastEthernet0/1
 description PC1 - SALES
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface FastEthernet0/2
 description PC2 - IT
 switchport mode access
 switchport access vlan 20
 no shutdown
!
! ---------------------------------------------------------------------
! 6. Unused ports: forced to access, parked in VLAN 998, shut down
! ---------------------------------------------------------------------
interface range FastEthernet0/3 - 24
 description UNUSED - parked
 switchport mode access
 switchport access vlan 998
 shutdown
!
! ---------------------------------------------------------------------
! 7. Management - SVI in VLAN 99, VLAN 1 disabled.
!    A Layer 2 switch needs a default gateway to answer hosts in other
!    subnets (for example SSH from PC1 in VLAN 10).
! ---------------------------------------------------------------------
interface Vlan1
 no ip address
 shutdown
!
interface Vlan99
 description MGMT SVI
 ip address 192.168.99.11 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
! ---------------------------------------------------------------------
! 8. SSH v2 and lines
! ---------------------------------------------------------------------
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
!
line console 0
 exec-timeout 5 0
 logging synchronous
 login local
!
line vty 0 15
 exec-timeout 5 0
 logging synchronous
 login local
 transport input ssh
!
end
write memory
