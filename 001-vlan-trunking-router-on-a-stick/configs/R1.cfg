! =====================================================================
!  Day 001 | R1 - Router-on-a-Stick (inter-VLAN routing)
!  Platform : Cisco ISR4331 (Packet Tracer 8.x)
!  Role     : Default gateway for VLANs 10, 20 and 99 using 802.1Q
!             subinterfaces on one physical link to SW1.
!  Usage    : Paste from user EXEC mode (Router>).
!  NOTE     : Replace every <REDACTED> with your own lab password first.
!             IOS does not support inline comments, so every comment
!             below sits on its own line.
! =====================================================================
enable
configure terminal
!
! ---------------------------------------------------------------------
! 1. Identity
! ---------------------------------------------------------------------
hostname R1
! Stop mistyped commands from being treated as DNS lookups
no ip domain-lookup
! A domain name is required before RSA keys (SSH) can be generated
ip domain-name lab.local
!
! ---------------------------------------------------------------------
! 2. Secure local access
! ---------------------------------------------------------------------
! "secret" stores a strong hash, never use "enable password"
enable secret <REDACTED>
username admin privilege 15 secret <REDACTED>
! Obscures any remaining type-0 passwords in the running config
service password-encryption
banner motd # Authorized access only. All activity is monitored. #
!
! ---------------------------------------------------------------------
! 3. SSH v2 (Telnet is disabled under the VTY lines below)
! ---------------------------------------------------------------------
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
! ---------------------------------------------------------------------
! 4. Trunk link to SW1 - the physical interface carries no IP address.
!    Each subinterface is the gateway for one VLAN.
! ---------------------------------------------------------------------
interface GigabitEthernet0/0/0
 description TRUNK to SW1 G0/1 (802.1Q)
 no ip address
 no shutdown
!
interface GigabitEthernet0/0/0.10
 description GATEWAY - VLAN 10 SALES
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
!
interface GigabitEthernet0/0/0.20
 description GATEWAY - VLAN 20 IT
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
!
interface GigabitEthernet0/0/0.99
 description GATEWAY - VLAN 99 MGMT (switch SVIs)
 encapsulation dot1Q 99
 ip address 192.168.99.1 255.255.255.0
!
! Native VLAN must match the switch trunk (999). Untagged frames land
! here and go nowhere, because this subinterface has no IP on purpose.
interface GigabitEthernet0/0/0.999
 description NATIVE VLAN 999 - unused, no IP by design
 encapsulation dot1Q 999 native
!
! ---------------------------------------------------------------------
! 5. Shut down unused interfaces (reduces attack surface)
! ---------------------------------------------------------------------
interface GigabitEthernet0/0/1
 description UNUSED
 shutdown
!
interface GigabitEthernet0/0/2
 description UNUSED
 shutdown
!
! ---------------------------------------------------------------------
! 6. Console and remote access lines
! ---------------------------------------------------------------------
line console 0
 exec-timeout 5 0
 logging synchronous
 login local
!
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 login local
 transport input ssh
!
end
write memory
